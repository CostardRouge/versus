<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- seo:head -->
    <meta name="theme-color" content="#ECEEF2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0E1015" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply a saved light/dark choice before the first paint to avoid a flash of the wrong theme.
      try {
        const theme = JSON.parse(localStorage.getItem('versus-prefs') || '{}').theme;
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app">
      <header class="top">
        <button class="brand" type="button" data-action="back"><span class="brand-mark" aria-hidden="true">vs</span>Versus</button>
        <div class="top-right">
          <span class="top-note" id="top-note"></span>
          <fieldset class="theme">
            <button type="button" data-action="theme" data-t="system" aria-pressed="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
            <button type="button" data-action="theme" data-t="light" aria-pressed="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
            <button type="button" data-action="theme" data-t="dark" aria-pressed="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
          </fieldset>
          <fieldset class="lang">
            <button type="button" data-action="lang" data-l="en" aria-pressed="false">EN</button>
            <button type="button" data-action="lang" data-l="fr" aria-pressed="false">FR</button>
          </fieldset>
        </div>
      </header>
      <main id="view"></main>
    </div>
    <div class="drop-overlay" aria-hidden="true"><div id="drop-text"></div></div>
    <div id="cpop" class="cpop" role="dialog" hidden></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="live" class="sr-only" aria-live="polite"></div>
    <div id="modal" class="modal" hidden>
      <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="m-title">
        <h3 id="m-title">Confirm</h3>
        <div id="m-body" class="m-body"></div>
        <div class="modal-actions">
          <button class="btn ghost" id="m-cancel" type="button"></button>
          <button class="btn primary" id="m-ok" type="button"></button>
        </div>
      </div>
    </div>
    <!-- seo:noscript -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
