# Dependabot, the portfolio's shape (COMMON-PROJECT-SPEC.md, C20).
# This repository has one package.json at the root and GitHub Actions; no Dockerfile.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 3
    groups:
      # Families that only work in step: a major moves the whole family.
      # Listed first, since a dependency goes to the first group it matches.
      vite:
        patterns: ['vite', '@vitejs/*']
        update-types: [major]
      vitest:
        patterns: ['vitest', '@vitest/*']
        update-types: [major]
      biome:
        patterns: ['@biomejs/*']
        update-types: [major]
      playwright:
        patterns: ['@playwright/test', 'playwright-core', 'playwright']
        update-types: [major]
      fontsource:
        patterns: ['@fontsource/*', '@fontsource-variable/*']
        update-types: [major]
      # Every minor and patch, production and development together:
      # one pull request a month.
      minor-and-patch:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # Node's type definitions follow .nvmrc's major (C14, D121).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
