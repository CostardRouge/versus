name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs on pull requests; never interrupt a deployment from main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint and format check
        run: npx biome ci .

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run coverage

      - name: Build
        run: npm run build
        env:
          # Canonical address in the head, sitemap and llms.txt; unset, it is versus.steevepommier.com (build/site.ts).
          VITE_SITE_URL: ${{ vars.SITE_URL }}
          # This build is the GitHub Pages copy, served under /<repository>/: the app's <base> needs that path.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload site artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  e2e:
    name: End-to-end (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The browser matching the pinned @playwright/test, with the system libraries it needs.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # The app on Vite's dev server, the published boards API faked per test (playwright.config.ts).
      - name: End-to-end tests
        run: npm run e2e

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: [verify, e2e]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Fails with "Not Found" until Settings → Pages → Source is set to "GitHub Actions".
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-worker:
    name: Deploy to Cloudflare
    needs: [verify, e2e]
    # Off until the repository has the CLOUDFLARE_ACCOUNT_ID variable (and the CLOUDFLARE_API_TOKEN secret).
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Builds the app in worker mode, deploys the Worker (creates the D1 database the first time),
      # then applies the D1 migrations. The custom domain is managed in the dashboard; deploys keep it.
      - name: Build and deploy
        run: npm run worker:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          VITE_SITE_URL: ${{ vars.SITE_URL }}
